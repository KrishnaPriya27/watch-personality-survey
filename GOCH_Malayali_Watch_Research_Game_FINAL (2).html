<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="A short interactive watch research game about design, buying behaviour, value and heritage.">
<title>Your Watch Personality — Research Game</title>
<style>
:root{--bg:#f5f1e8;--card:#fffdf9;--ink:#181715;--muted:#6f6a61;--line:#ddd5c8;--soft:#eee7db;--accent:#191919}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fffdf8 0,#f5f1e8 52%,#eee7dc 100%);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:24px 16px 50px}.card{background:var(--card);border:1px solid #e8e0d4;border-radius:28px;padding:28px;box-shadow:0 15px 50px #00000012}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}h1{font-size:clamp(30px,7vw,46px);line-height:1.02;margin:12px 0}h2{font-size:26px;line-height:1.18;margin:8px 0 18px}.sub{color:var(--muted);line-height:1.55}.progress{height:7px;background:#e8e1d6;border-radius:9px;margin:18px 0 28px;overflow:hidden}.bar{height:100%;background:#191919;border-radius:9px;width:0;transition:.25s}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:15px;margin:9px 0;font-size:16px;cursor:pointer;transition:.15s}.option:hover{transform:translateY(-1px);box-shadow:0 5px 14px #0000000b}.option.selected{border:2px solid #191919;padding:14px;background:#faf7f0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .option{text-align:center;min-height:64px}.multi-note{font-size:13px;color:var(--muted);margin:-8px 0 12px}.next{border:0;background:#191919;color:#fff;border-radius:14px;padding:14px 22px;font-size:16px;font-weight:650;margin-top:14px;cursor:pointer}.next:disabled{opacity:.3;cursor:not-allowed}.back{border:0;background:transparent;color:var(--muted);padding:14px 8px;font-size:14px;cursor:pointer}.actions{display:flex;gap:8px;align-items:center}.badge{display:inline-block;padding:8px 12px;border-radius:999px;background:var(--soft);font-weight:750;margin:6px 0 14px}.result{font-size:18px;line-height:1.65}input,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;font-size:16px;margin:7px 0;background:white}textarea{min-height:95px;resize:vertical}.small{font-size:13px;color:var(--muted);line-height:1.45}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}.question-count{font-size:13px;color:var(--muted);margin-bottom:6px}.required-note{font-size:13px;color:var(--muted);margin-top:10px}@media(max-width:520px){.card{padding:21px;border-radius:22px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="brand">A short watch research game</div>
<div id="round" class="small" style="margin-top:8px"></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div id="app"></div>
</div><div class="footer">Anonymous research • No name required • Email is optional</div></div>
<script>
/* Google Sheets connection: paste your Apps Script /exec URL into ENDPOINT. */
const ENDPOINT="https://script.google.com/macros/s/AKfycbyklsttjAnXdUgJNIoUoxoCsa-kyjG_QL3jaMLWXolNSC4_mSgzetIlB1gMuUstvwNi/exec";

const questions=[
{key:"vibe",title:"Pick the watch vibe that feels most like you.",opts:[["quiet","Quiet & elegant"],["bold","Bold & confident"],["classic","Classic & timeless"],["modern","Modern & minimal"],["artistic","Artistic & unusual"]]},
{key:"reaction",title:"Someone notices your watch. What would you secretly love them to say?",opts:[["nice","“That’s a really beautiful watch.”"],["where","“Wait… where did you get that?”"],["expensive","“That looks expensive.”"],["details","“I love the little details.”"],["unique","“I’ve never seen anything like that.”"]]},
{key:"recent",title:"When did you last buy a watch for yourself?",opts:[["3m","Within the last 3 months"],["6m","3–6 months ago"],["12m","6–12 months ago"],["3y","1–3 years ago"],["old","More than 3 years ago"],["never","I’ve never bought one for myself"]]},
{key:"lastSpend",title:"How much did you spend on your last watch?",opts:[["under2","Under ₹2,000"],["2to5","₹2,000–₹4,999"],["5to75","₹5,000–₹7,499"],["75to10","₹7,500–₹9,999"],["10to15","₹10,000–₹14,999"],["15to25","₹15,000–₹24,999"],["25plus","₹25,000+"],["none","I’ve never bought one"]]},
{key:"frequency",title:"How often do you realistically buy watches?",opts:[["several","Several times a year"],["year","About once a year"],["2to3","Every 2–3 years"],["need","Only when I need one"],["gift","Mostly as gifts"],["rare","Almost never"]]},
{key:"reason",title:"What is usually the MAIN reason you choose a watch?",opts:[["design","I love the design"],["brand","Brand reputation"],["quality","Quality / materials"],["deal","It’s a good deal"],["meaning","It represents something meaningful"],["need","I simply need a watch"],["gift","It’s for someone else"]]},
{key:"category",title:"Imagine a new Indian brand makes a premium everyday watch inspired by Kerala. Which is closest to how you feel?",opts:[["yes","That’s exactly the kind of product I’d want."],["maybe","Interesting — I’d consider it if the watch itself was beautiful."],["bonus","I like the idea, but I wouldn’t pay extra for the Kerala connection."],["gift","I’d mainly consider it as a gift."],["no","It doesn’t really interest me."],["normal","I’d prefer a normal watch without the cultural connection."]]},
{key:"culture",title:"How visible should the Kerala influence be?",opts:[["obvious","Very obvious — people should immediately recognise it."],["modern","Clearly inspired, but sophisticated and modern."],["subtle","Subtle references you notice when you look closely."],["hidden","Extremely subtle — mainly meaningful to someone who knows the story."],["none","I don’t want cultural elements on the watch."]]},
{key:"premium",multi:true,max:3,title:"What makes a watch feel premium to you? Pick up to 3.",opts:[["design","Overall design"],["finish","Materials & finishing"],["movement","Movement / specifications"],["wrist","How it feels on the wrist"],["bracelet","Bracelet / strap quality"],["dial","Dial & hands"],["brand","Brand reputation"],["packaging","Packaging & presentation"]]},
{key:"bestValue",title:"For a beautiful, well-made watch from a new Indian brand, which price feels like the strongest value?",opts:[["4999","₹4,999"],["5999","₹5,999"],["6999","₹6,999"],["7999","₹7,999"],["9999","₹9,999"],["12999","₹12,999"],["none","I wouldn’t buy an unknown brand at these prices"]]},
{key:"cheap",title:"At which price would a premium-looking new-brand watch start to feel suspiciously cheap?",opts:[["2999","₹2,999"],["3999","₹3,999"],["4999","₹4,999"],["5999","₹5,999"],["6999","₹6,999"],["never","Price wouldn’t affect that feeling"]]},
{key:"expensive",title:"At which price would it start feeling expensive, but still possible if the watch was excellent?",opts:[["5999","₹5,999"],["6999","₹6,999"],["7999","₹7,999"],["9999","₹9,999"],["12999","₹12,999"],["14999","₹14,999+"]]},
{key:"tooExpensive",title:"At which price would you personally say: “No, that’s too expensive”?",opts:[["5999","₹5,999"],["6999","₹6,999"],["7999","₹7,999"],["9999","₹9,999"],["12999","₹12,999"],["14999","₹14,999+"]]},
{key:"intent",title:"Be brutally honest. If a beautiful Kerala-inspired watch from a new Indian brand cost ₹7,999, what would you most likely do?",opts:[["buy","I’d buy it"],["consider","I’d seriously consider buying it"],["save","I’d save/share it but probably wouldn’t buy"],["skip","I’d skip it"]]},
{key:"move",multi:true,max:3,title:"What would move you from “maybe” to “buy”? Pick up to 3.",opts:[["reviews","Strong customer reviews"],["physical","Seeing the watch in person"],["sapphire","Sapphire crystal"],["steel","316L stainless-steel case"],["movement","A reliable, respected movement"],["warranty","Strong warranty / easy returns"],["bracelet","A high-quality bracelet"],["limited","Limited / numbered edition"],["story","A strong brand story"],["social","Lots of real people wearing it"],["price","A lower price"]]},
{key:"trust",multi:true,max:3,title:"What would make you trust a new Indian watch brand? Pick up to 3.",opts:[["reviews","Real customer reviews"],["photos","Actual photos & videos"],["warranty","Strong warranty / easy returns"],["specs","Clear specifications"],["website","Premium website & presentation"],["friend","Recommendation from someone I trust"],["see","Seeing it in person"],["founder","A convincing founder / brand story"],["community","A strong community around the brand"]]},
{key:"barrier",title:"What is most likely to make you say NO?",opts:[["quality","I’m not convinced about quality"],["unknown","I don’t know the brand"],["price","Too expensive"],["established","I’d rather buy Casio / Timex / Citizen etc."],["after","After-sales / warranty worries"],["cheap","I’m worried it will look cheap in person"],["online","I don’t like buying watches online"],["need","I simply don’t need another watch"],["culture","The cultural design might feel too obvious"],["other","Something else"]]},
{key:"gift",title:"Who would you be most likely to buy a Kerala-inspired watch for?",opts:[["self","Myself"],["partner","Partner"],["parent","Father / mother"],["sibling","Brother / sister"],["friend","Friend"],["diaspora","Someone living abroad"],["wedding","Wedding / engagement gift"],["none","I wouldn’t buy one as a gift"]]},
{key:"location",title:"Where do you currently live?",opts:[["kerala","Kerala"],["india","Other part of India"],["uk","UK"],["uae","UAE"],["canada","Canada"],["usa","USA"],["australia","Australia"],["other","Other country"]]},
{key:"age",title:"Which age group are you in?",opts:[["18-24","18–24"],["25-34","25–34"],["35-44","35–44"],["45-54","45–54"],["55plus","55+"]]},
{key:"sentence",type:"text",title:"Finish this sentence: “I’d buy a Kerala-inspired watch if…”",placeholder:"Say what would genuinely make you want one.",required:true},
{key:"early",title:"One last thing: if a new Kerala-inspired watch matched your taste, would you want to see it first?",opts:[["yes","Yes — show me first"],["maybe","Maybe"],["no","Not really"]]}
];

const labels={vibe:"Watch vibe",reaction:"Ideal reaction",recent:"Last watch purchase",lastSpend:"Last watch spend",frequency:"Purchase frequency",reason:"Main purchase reason",category:"Kerala-inspired watch reaction",culture:"Heritage visibility",premium:"Premium factors",bestValue:"Strongest value price",cheap:"Suspiciously cheap price",expensive:"Expensive-but-possible price",tooExpensive:"Too-expensive price",intent:"₹7,999 purchase intent",move:"Purchase triggers",trust:"Trust factors",barrier:"Main barrier",gift:"Gift target",location:"Location",age:"Age",sentence:"Open response",early:"Early-access interest"};
let i=-1,answers={},sessionId=crypto.randomUUID?crypto.randomUUID():String(Date.now());
function intro(){document.getElementById("round").textContent="WELCOME";document.getElementById("bar").style.width="0%";document.getElementById("app").innerHTML=`<h1>⌚ WHAT’S YOUR WATCH PERSONALITY?</h1><p class="sub">A short game about watches, design, buying habits, value and identity.</p><p>No boring survey. No right or wrong answers. Just pick what feels true to you.</p><button class="next" onclick="start()">LET’S PLAY →</button><p class="small" style="margin-top:16px">About 3 minutes. No name required. Your email is optional.</p>`}
function start(){i=0;render()}
function render(){const q=questions[i],pct=(i/questions.length)*100;document.getElementById("round").textContent=`ROUND ${i+1} OF ${questions.length}`;document.getElementById("bar").style.width=`${pct}%`;if(q.type==="text"){document.getElementById("app").innerHTML=`<div class="question-count">OPEN ANSWER</div><h2>${q.title}</h2><textarea id="textAnswer" placeholder="${q.placeholder||"Type your answer…"}">${answers[q.key]||""}</textarea><div class="actions">${i>0?'<button class="back" onclick="back()">← Back</button>':''}<button class="next" id="next">CONTINUE →</button></div><div class="required-note">This answer is required so we can learn from your own words.</div>`;document.getElementById("next").onclick=()=>{const v=document.getElementById("textAnswer").value.trim();if(!v)return alert("Please add a short answer before continuing.");answers[q.key]=v;i++;i<questions.length?render():result();};return}
const grid=q.opts.length>4?"grid":"";document.getElementById("app").innerHTML=`<h2>${q.title}</h2>${q.multi?`<div class="multi-note">Choose up to ${q.max}.</div>`:''}<div class="${grid}" id="opts"></div><div class="actions">${i>0?'<button class="back" onclick="back()">← Back</button>':''}<button class="next" id="next" disabled>CONTINUE →</button></div>`;
const selected=Array.isArray(answers[q.key])?answers[q.key]:[];q.opts.forEach(([v,t])=>{const b=document.createElement("button");b.className="option";b.textContent=t;if(q.multi?selected.includes(v):answers[q.key]===v)b.classList.add("selected");b.onclick=()=>{if(q.multi){let a=Array.isArray(answers[q.key])?[...answers[q.key]]:[];if(a.includes(v))a=a.filter(x=>x!==v);else if(a.length<q.max)a.push(v);else return;answers[q.key]=a;b.classList.toggle("selected");document.querySelectorAll("#opts .option").forEach((x,idx)=>{const val=q.opts[idx][0];x.classList.toggle("selected",a.includes(val))});document.getElementById("next").disabled=a.length===0}else{answers[q.key]=v;document.querySelectorAll("#opts .option").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");document.getElementById("next").disabled=false}};document.getElementById("opts").appendChild(b)});
if(q.multi)document.getElementById("next").disabled=selected.length===0;else if(answers[q.key])document.getElementById("next").disabled=false;document.getElementById("next").onclick=()=>{i++;i<questions.length?render():result()}}
function back(){i--;render()}
function personality(){if(answers.vibe==="bold"||answers.reaction==="expensive")return["The Statement Maker","You like presence. Strong design, confidence and a watch that gets noticed matter to you."];if(answers.vibe==="classic")return["The Timeless One","You gravitate toward pieces that can outlive trends: refined, familiar and effortlessly wearable."];if(answers.vibe==="modern")return["The Modern Minimalist","You like clean design and contemporary details. Less noise, more intention."];if(answers.vibe==="artistic"||answers.reaction==="unique")return["The Story Collector","You notice character, creativity and details that make a piece feel personal."];return["The Quiet Collector","You value understated design, thoughtful details and a watch that feels special without shouting."]}
function result(){const [name,desc]=personality();document.getElementById("round").textContent="YOUR RESULT";document.getElementById("bar").style.width="100%";document.getElementById("app").innerHTML=`<h1>You’re ${name}.</h1><div class="badge">WATCH PERSONALITY</div><p class="result">${desc}</p><p class="sub">🎉 You made it! Your answers help us understand what people genuinely value before a new watch brand invests in making anything.</p><hr><p><b>Would you like to hear if something comes from this research?</b></p><p class="small">Optional — leave your email only if you want early access or updates.</p><input id="email" type="email" placeholder="Optional email address"><textarea id="comment" placeholder="Optional: anything modern watch brands could do better?"></textarea><button class="next" onclick="finish()">SUBMIT MY ANSWERS →</button><p id="status" class="small" style="margin-top:12px"></p>`}
async function finish(){const email=document.getElementById("email").value.trim(),comment=document.getElementById("comment").value.trim(),[personalityName]=personality();const payload={sessionId,submittedAt:new Date().toISOString(),personality:personalityName,email,comment,...answers};localStorage.setItem("watchResearchResponse_"+sessionId,JSON.stringify(payload));const status=document.getElementById("status");if(ENDPOINT){try{await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});status.textContent="Thank you — your answers have been submitted."}catch(e){status.textContent="Your answers are saved on this device, but the online submission could not be confirmed."}}else status.textContent="Thank you — your answers are saved on this device. Online collection has not been connected yet.";document.querySelector(".next").disabled=true}
intro();
</script></body></html>
